name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync environment
        run: uv sync

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
        env:
          CI: "true"

      - name: Catalog audit (index-only)
        run: uv run python tools/audit_catalog.py --index-only
